name: Benchmark
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ldbc_benchmark:
    name: ldbc benchmark
    env:
      NUM_THREADS: 30
      GEN: Ninja
    runs-on: gorgonzola-self-hosted-benchmarking
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make benchmark

      - name: Benchmark
        continue-on-error: true
        run: |
          set +e
          python3 modules/benchmark/benchmark_runner.py --dataset ldbc-sf100 --thread 10
          echo $? > modules/benchmark/exit_code

      - name: Upload benchmark logs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: /tmp/benchmark_logs

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results
          path: modules/benchmark/compare_result.md

      - name: Fail if benchmark failed
        run: |
          if [ $(cat modules/benchmark/exit_code) -ne 0 ]; then
            echo "Benchmark failed"
            exit 1
          fi
